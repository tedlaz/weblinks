<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070604">
  <title>ted-links</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="styles.css" rel="stylesheet">
</head>

<body>
  <header class="topbar">
    <button id="menu-toggle" class="icon-btn" aria-label="Menu" aria-expanded="false">☰</button>
    <a class="brand" href="#">ted<span>-links</span></a>
    <div class="search-box">
      <input id="search" type="search" placeholder="Search all links…" aria-label="Search" autocomplete="off">
      <kbd>/</kbd>
    </div>
  </header>
  <div class="layout">
    <nav id="sidebar" aria-label="Categories">
      <ul id="menu"></ul>
    </nav>
    <div id="overlay"></div>
    <main>
      <div class="page-head">
        <h1 id="page-title"></h1>
        <span id="page-meta"></span>
      </div>
      <div id="content"></div>
    </main>
  </div>
  <script src="links.js"></script>
  <script src="app.js"></script>
</body>

</html>
